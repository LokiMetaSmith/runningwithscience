<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>

  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
  <meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="me" href="{{ site.youtube_url }}">
  <link rel="me" href="{{ site.business_url }}">
  <link rel="me" href="mailto:{{ site.author.email }}">
  {% feed_meta %}
</head>

<body>
  {% include navbar.html %}

  <div class="container">
    {{ content }}
  </div>

  <footer>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name | default: site.title }}</p>
  </footer>

  <script src="/assets/js/main.js"></script>
</body>

</html>
